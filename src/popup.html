<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #f5f5f5;
      color: #333;
      width: 320px;
      font-size: 13px;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: 16px;
      text-align: center;
    }

    .section {
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .section h2 {
      margin: 0 0 8px 0;
      font-size: 13px;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }

    .row {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .row label {
      flex: 0 0 80px;
      font-weight: 500;
      font-size: 12px;
    }

    .row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-right: 6px;
    }

    .row input[type="color"] {
      width: 36px;
      height: 24px;
      border: 1px solid #ccc;
      border-radius: 3px;
      cursor: pointer;
      padding: 0;
    }

    .row input[type="text"] {
      flex: 1;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 12px;
    }

    .row input[type="number"] {
      width: 60px;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 12px;
      margin-right: 4px;
    }

    .row select {
      flex: 1;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 12px;
    }

    .row textarea {
      flex: 1;
      padding: 4px 6px;
      border: 1px solid #ccc;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
      resize: vertical;
      min-height: 80px;
    }

    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }

    button.primary {
      background-color: #4285f4;
      color: white;
    }

    button.primary:hover {
      background-color: #3367d6;
    }

    button.secondary {
      background-color: #e0e0e0;
      color: #333;
    }

    button.secondary:hover {
      background-color: #d0d0d0;
    }

    .help-text {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }

    .color-row {
      display: grid;
      grid-template-columns: 80px 36px 1fr;
      gap: 6px;
      align-items: center;
      margin-bottom: 4px;
    }

    .color-row label {
      font-size: 12px;
    }

    .unit {
      color: #666;
      font-size: 11px;
    }

    .status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px;
      text-align: center;
      color: white;
      font-size: 12px;
      z-index: 1000;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #1e1e1e;
        color: #d7dad8;
      }

      .section {
        background-color: #2d2d2d;
        border-color: #444;
      }

      .section h2 {
        border-bottom-color: #444;
      }

      input[type="text"],
      input[type="number"],
      select,
      textarea {
        background-color: #3d3d3d;
        border-color: #555;
        color: #d7dad8;
      }

      input[type="color"] {
        background-color: #3d3d3d;
        border-color: #555;
      }

      input[type="checkbox"] {
        accent-color: #4285f4;
      }

      .help-text {
        color: #999;
      }

      .unit {
        color: #999;
      }

      button.secondary {
        background-color: #3d3d3d;
        color: #d7dad8;
      }

      button.secondary:hover {
        background-color: #4d4d4d;
      }
    }
  </style>
</head>

<body>
  <h1>JSONView 设置</h1>

  <div class="section">
    <h2>层级虚线</h2>
    <div class="row">
      <label>启用</label>
      <input type="checkbox" id="lineEnabled" checked>
    </div>
    <div class="row">
      <label>颜色</label>
      <input type="color" id="lineColor" value="#646464">
    </div>
    <div class="row">
      <label>样式</label>
      <select id="lineStyle">
        <option value="dashed">虚线</option>
        <option value="solid">实线</option>
        <option value="dotted">点线</option>
        <option value="double">双线</option>
      </select>
    </div>
    <div class="row" style="align-items: flex-start;">
      <label>自定义CSS</label>
      <textarea id="lineCustomCss">ul.array::before,
ul.obj::before {
  content: "";
  position: absolute;
  left: calc(-1 * var(--jsonview-indent-size));
  top: 0.6em;
  bottom: 0.6em;
  width: 0;
  border-left: 1px var(--jsonview-line-style) var(--jsonview-line-color);
  pointer-events: none;
  display: var(--jsonview-line-enabled);
}</textarea>
    </div>
  </div>

  <div class="section">
    <h2>颜色</h2>
    <div class="color-row">
      <label>字符串</label>
      <input type="color" id="colorString" value="#78a62d">
      <span></span>
    </div>
    <div class="color-row">
      <label>数字</label>
      <input type="color" id="colorNumber" value="#236dd7">
      <span></span>
    </div>
    <div class="color-row">
      <label>布尔值</label>
      <input type="color" id="colorBoolean" value="#d43c25">
      <span></span>
    </div>
    <div class="color-row">
      <label>Null</label>
      <input type="color" id="colorNull" value="#a52a2a">
      <span></span>
    </div>
    <div class="color-row">
      <label>键名</label>
      <input type="color" id="colorKey" value="#d7dad8">
      <span></span>
    </div>
    <div class="color-row">
      <label>链接</label>
      <input type="color" id="colorLink" value="#4188ec">
      <span></span>
    </div>
  </div>

  <div class="section">
    <h2>字体</h2>
    <div class="row">
      <label>大小</label>
      <input type="number" id="fontSize" value="1.2" min="0.5" max="3" step="0.1">
      <span class="unit">em</span>
    </div>
    <div class="row">
      <label>键名加粗</label>
      <input type="checkbox" id="keyBold" checked>
    </div>
    <div class="row">
      <label>值加粗</label>
      <input type="checkbox" id="valueBold">
    </div>
  </div>

  <div class="section">
    <h2>缩进</h2>
    <div class="row">
      <label>大小</label>
      <input type="number" id="indentSize" value="2" min="0.5" max="8" step="0.5">
      <span class="unit">em</span>
    </div>
  </div>

  <div class="section">
    <h2>背景</h2>
    <div class="row">
      <label>背景色</label>
      <input type="color" id="bgColor" value="#27292c">
    </div>
    <div class="row">
      <label>文本色</label>
      <input type="color" id="textColor" value="#d7dad8">
    </div>
  </div>

  <div class="section">
    <h2>悬浮高亮</h2>
    <div class="row">
      <label>启用</label>
      <input type="checkbox" id="hoverEnabled" checked>
    </div>
    <div class="row">
      <label>背景色</label>
      <input type="color" id="hoverBgColor" value="#3a3d41">
    </div>
  </div>

  <div class="buttons">
    <button class="primary" id="save">保存</button>
    <button class="secondary" id="reset">恢复默认</button>
  </div>

  <script src="popup.js"></script>
</body>

</html>
